# =============================================================================
# docker-compose.yml — maquina DESTINO (C:\Sistemma) e producao
# =============================================================================
# Atualizar versao na destino (somente docker-compose.yml + .env — SEM backend/frontend/):
#   1. Dev publica:  .\publicar.ps1 -Tag 2.1.0
#   2. Destino — edite TAG=2.1.0 no .env
#   3. docker compose pull
#   4. docker compose up -d
#
# Primeira vez na destino:
#   Copy-Item env.docker.example .env     (edite senhas e TAG)
#   docker login nexus.neurai-platform.com -u admin -p "senha"
#
# Erros comuns:
#   "path backend not found" — remova docker-compose.dev.yml da pasta destino
#   "no matching manifest linux/amd64" — republique: .\publicar.ps1 -Tag X
#   "pull access denied for minio/minio" — não precisa puxar MinIO/Postgres.
#     docker compose pull backend frontend
#     docker compose up -d --force-recreate backend frontend
#
# DEV (build local — requer packages/shared, backend/ e frontend/):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#   .\build-and-push.ps1 -BuildOnly -Up
# =============================================================================

name: sistemma

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: sistemma-postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    environment:
      POSTGRES_DB: ${DB_NAME:-abastecimento}
      POSTGRES_USER: ${DB_USER:-neurai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "${DB_PORT_EXTERNAL:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-neurai} -d ${DB_NAME:-abastecimento}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sistemma-net

  minio:
    image: quay.io/minio/minio:latest
    container_name: sistemma-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no .env}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - sistemma-net

  # ─── WuzAPI (WhatsApp) — sobe junto com o Sistemma ───
  wuzapi-db:
    image: docker.io/library/postgres:16-alpine
    container_name: sistemma-wuzapi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wuzapi
      POSTGRES_USER: wuzapi
      POSTGRES_PASSWORD: ${WUZAPI_DB_PASSWORD:-wuzapi}
    volumes:
      - wuzapi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wuzapi -d wuzapi"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sistemma-net

  wuzapi:
    image: docker.io/asternic/wuzapi:latest
    platform: linux/amd64
    container_name: sistemma-wuzapi
    restart: unless-stopped
    depends_on:
      wuzapi-db:
        condition: service_healthy
    environment:
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:-1234ABCD}
      WUZAPI_GLOBAL_ENCRYPTION_KEY: ${WUZAPI_GLOBAL_ENCRYPTION_KEY:-wuzapi-sistemma-aes256-key-32ch!}
      WUZAPI_GLOBAL_HMAC_KEY: ${WUZAPI_GLOBAL_HMAC_KEY:-wuzapi-sistemma-hmac-key-min-32chars!}
      # Fixo na rede Docker. Não leia WUZAPI_WEBHOOK_URL do .env: o valor antigo
      # host.docker.internal entrega a mensagem duas vezes ou para o lugar errado.
      WUZAPI_GLOBAL_WEBHOOK: http://sistemma-backend:3200/api/wuzapi/webhook
      DB_USER: wuzapi
      DB_PASSWORD: ${WUZAPI_DB_PASSWORD:-wuzapi}
      DB_NAME: wuzapi
      DB_HOST: wuzapi-db
      DB_PORT: 5432
      TZ: ${TZ:-America/Sao_Paulo}
      WEBHOOK_FORMAT: json
      SESSION_DEVICE_NAME: ${WUZAPI_INSTANCE_NAME:-Sistemma}
    ports:
      - "${WUZAPI_PORT:-8080}:8080"
    volumes:
      - wuzapi_files:/app/files
      - wuzapi_dbdata:/app/dbdata
    shm_size: "256mb"
    networks:
      - sistemma-net

  backend:
    platform: linux/amd64
    image: ${REGISTRY:-nexus.neurai-platform.com/docker-registry}/sistemma-backend:${TAG:-latest}
    pull_policy: always
    container_name: sistemma-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      wuzapi:
        condition: service_started
    environment:
      APP_PORT: 3200
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DB_USER:-neurai}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_NAME: ${DB_NAME:-abastecimento}
      CONTROL_DATABASE_NAME: ${CONTROL_DATABASE_NAME:-}
      MULTI_TENANT: ${MULTI_TENANT:-false}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Defina JWT_REFRESH_SECRET no .env}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-abastecimentos}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9002}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3300}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      ALLOWED_MIME_TYPES: ${ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
      DADOS_CACHE_TTL_MS: ${DADOS_CACHE_TTL_MS:-120000}
      DADOS_CACHE_MAX_ENTRADAS: ${DADOS_CACHE_MAX_ENTRADAS:-12}
      GRAFICOS_DADOS_LIMITE: ${GRAFICOS_DADOS_LIMITE:-20000}
      KPIS_CONSOLIDADO_CONCURRENCY: ${KPIS_CONSOLIDADO_CONCURRENCY:-1}
      ENDPOINTS_PESADOS_CONCURRENCY: ${ENDPOINTS_PESADOS_CONCURRENCY:-1}
      PDF_CACHE_MAX_ENTRADAS: ${PDF_CACHE_MAX_ENTRADAS:-5}
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      DB_POOL_CONNECT_MS: ${DB_POOL_CONNECT_MS:-30000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-120000}
      SKIP_STARTUP_SEED: ${SKIP_STARTUP_SEED:-false}
      SKIP_STARTUP_MIGRATIONS: ${SKIP_STARTUP_MIGRATIONS:-false}
      SYNC_KPIS_UNIVERSAIS: ${SYNC_KPIS_UNIVERSAIS:-true}
      DASHBOARD_EXECUTIVO_CACHE_TTL_MS: ${DASHBOARD_EXECUTIVO_CACHE_TTL_MS:-86400000}
      DASHBOARD_CACHE_DISCO: ${DASHBOARD_CACHE_DISCO:-true}
      DASHBOARD_WARMUP_ENABLED: ${DASHBOARD_WARMUP_ENABLED:-true}
      DASHBOARD_WARMUP_DELAY_MS: ${DASHBOARD_WARMUP_DELAY_MS:-45000}
      DASHBOARD_WARMUP_INTERVAL_MS: ${DASHBOARD_WARMUP_INTERVAL_MS:-86400000}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=768 --expose-gc}
      BUILD_SHA: ${BUILD_SHA:-unknown}
      IMAGE_TAG: ${TAG:-latest}
      # URLs internas fixas (mesma rede Docker) — não use host.docker.internal aqui
      WUZAPI_URL: http://wuzapi:8080
      WUZAPI_TOKEN: ${WUZAPI_TOKEN:-sistemma_wuzapi_token_local}
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:-1234ABCD}
      WUZAPI_WEBHOOK_URL: http://sistemma-backend:3200/api/wuzapi/webhook
      WUZAPI_WEBHOOK_SECRET: ${WUZAPI_WEBHOOK_SECRET:-}
      # A mesma chave do serviço wuzapi. O bloqueio permanece desligado até a validação.
      WUZAPI_GLOBAL_HMAC_KEY: ${WUZAPI_GLOBAL_HMAC_KEY:-}
      WUZAPI_WEBHOOK_ENFORCE: ${WUZAPI_WEBHOOK_ENFORCE:-false}
      WUZAPI_TIMEOUT_MS: ${WUZAPI_TIMEOUT_MS:-120000}
      WUZAPI_INSTANCE_NAME: ${WUZAPI_INSTANCE_NAME:-Sistemma}
      PLANILHAS_BACKUP_HOST_DIR: ${PLANILHAS_BACKUP_HOST_DIR:-./planilhas-ciclo}
      # Vazio = integração desligada. Preencha no .env só onde o Manu existir.
      MANU_WEBHOOK_URL: ${MANU_WEBHOOK_URL:-}
      MANU_CHATBOT_SECRET: ${MANU_CHATBOT_SECRET:-}
      # Sala técnica (RelatoriosColeta.exe). No Docker use host.docker.internal
      SALA_TECNICA_URL: ${SALA_TECNICA_URL:-}
      SALA_TECNICA_SECRET: ${SALA_TECNICA_SECRET:-}
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-3200}:3200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "256mb"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5
    volumes:
      - uploads_data:/app/uploads
      # Pasta na raiz do Docker (C:\Sistemma\planilhas-ciclo\{contrato}\{datas}.xlsx)
      - ${PLANILHAS_BACKUP_HOST_DIR:-./planilhas-ciclo}:/data/planilhas-ciclo
    networks:
      - sistemma-net

  frontend:
    platform: linux/amd64
    image: ${REGISTRY:-nexus.neurai-platform.com/docker-registry}/sistemma-frontend:${TAG:-latest}
    pull_policy: always
    container_name: sistemma-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3300}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - sistemma-net

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  uploads_data:
    driver: local
  wuzapi_pg_data:
    driver: local
  wuzapi_files:
    driver: local
  wuzapi_dbdata:
    driver: local

networks:
  sistemma-net:
    name: sistemma-network
    driver: bridge
